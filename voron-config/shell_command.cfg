[gcode_shell_command backup_github]
command: /bin/bash /home/pi/klipper-backup/run-voron-backup.sh
timeout: 300.
verbose: True

[gcode_macro BACKUP_GITHUB]
description: Guarda y verifica una copia de configuracion en GitHub
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("Ejecuta el backup cuando termine la impresion.") }
    {% else %}
        RUN_SHELL_COMMAND CMD=backup_github
    {% endif %}
