#####################################################################
#   Macros
#####################################################################
  
[gcode_macro PRINT_START]
description: Inicio de impresion
gcode:
    # Klipper recomienda empezar cada impresion con el estado de pausa limpio.
    CLEAR_PAUSE

    G32
    G90                            ; absolute positioning
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    CLEAN_NOZZLE

    # 350 mm build
    G0 X175 Y175 Z40 F4000

[gcode_macro PRINT_END]
description: Fin normal de impresion (usar CANCEL_PRINT para abortar una impresion en curso)
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    M400                           ; wait for buffer to clear

    # Retract only if the hotend is hot enough to extrude.
    {% if printer[printer.toolhead.extruder].can_extrude %}
        G92 E0
        G1 E-5.0 F1800
    {% endif %}

    TURN_OFF_HEATERS

    {% if "xyz" in printer.toolhead.homed_axes %}
        G90
        G0 X{x_safe} Y{y_safe} Z{z_safe} F12000
        G0 X{th.axis_maximum.x / 2.0} Y{th.axis_maximum.y - 5.0} F6000
    {% endif %}

    M107
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=did_retract VALUE=0

[gcode_macro PAUSE]
description: Pausa real de Klipper, retrae y aparca el cabezal
rename_existing: PAUSE_BASE
variable_retract: 1.0
gcode:
    {% if not printer.pause_resume.is_paused %}
        {% set th = printer.toolhead %}
        {% set park_x = params.X|default(175.0)|float %}
        {% set park_y = params.Y|default(th.axis_maximum.y - 5.0)|float %}
        {% set requested_lift = params.Z|default(5.0)|float|abs %}
        {% set available_z = th.axis_maximum.z|float - th.position.z|float %}
        {% set z_safe = [[requested_lift, available_z]|min, 0.0]|max %}

        # Este comando es el que detiene realmente la impresion y guarda la posicion.
        PAUSE_BASE

        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=did_retract VALUE=0

        {% if printer[printer.toolhead.extruder].can_extrude %}
            G91
            G1 E-{printer["gcode_macro PAUSE"].retract} F2100
            G90
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=did_retract VALUE=1
        {% endif %}

        {% if "xyz" in printer.toolhead.homed_axes %}
            G91
            G1 Z{z_safe} F900
            G90
            G1 X{park_x} Y{park_y} F6000
        {% endif %}
    {% else %}
        RESPOND TYPE=echo MSG="La impresion ya esta pausada"
    {% endif %}


[gcode_macro RESUME]
description: Reanuda una impresion pausada y vuelve a la posicion guardada
rename_existing: RESUME_BASE
variable_did_retract: 0
gcode:
    {% if printer.pause_resume.is_paused %}
        {% if printer["gcode_macro RESUME"].did_retract|int == 1 %}
            {% if printer[printer.toolhead.extruder].can_extrude %}
                G91
                G1 E{printer["gcode_macro PAUSE"].retract} F2100
                G90
            {% else %}
                {action_raise_error("No se puede reanudar: el extrusor esta demasiado frio")}
            {% endif %}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=did_retract VALUE=0
        RESUME_BASE {rawparams}
    {% else %}
        RESPOND TYPE=echo MSG="La impresora no esta pausada"
    {% endif %}


[gcode_macro CANCEL_PRINT]
description: Cancela realmente la impresion, retrae, aparca y apaga calentadores
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set th = printer.toolhead %}
    {% set park_x = 175.0 %}
    {% set park_y = th.axis_maximum.y|float - 5.0 %}
    {% set requested_lift = 5.0 %}
    {% set available_z = th.axis_maximum.z|float - th.position.z|float %}
    {% set z_safe = [[requested_lift, available_z]|min, 0.0]|max %}

    M400

    # Retract while the nozzle is still hot. Keep your original PLA/PETG logic.
    {% if printer[printer.toolhead.extruder].can_extrude %}
        {% if printer[printer.toolhead.extruder].target|float > 220 %}
            {% set cancel_retract = 5.0 %}
        {% else %}
            {% set cancel_retract = 1.0 %}
        {% endif %}
        G91
        G1 E-{cancel_retract} F3600
        G90
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z{z_safe} F1800
        G90
        G1 X{park_x} Y{park_y} F6000
    {% endif %}

    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR

    # CLEAR_PAUSE no reanuda; solamente limpia el estado de pausa.
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=did_retract VALUE=0

    # Este comando es imprescindible: cancela el fichero virtual SD.
    CANCEL_PRINT_BASE


[gcode_macro GO_CENTER]
gcode:
    G0 X175 Y175 Z110 F3800

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z50  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

    
