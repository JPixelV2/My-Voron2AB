#####################################################################
# 	Filament change macro M600
#####################################################################
[pause_resume]
# Velocidad de retorno a la posicion capturada al hacer RESUME.
# 100 mm/s es suficientemente rapido y menos brusco que los 300 mm/s anteriores.
recover_velocity: 100

[gcode_macro M600]
description: Cambio manual de filamento; pausa y permanece esperando RESUME
variable_park_x: 330
variable_park_y: 350
variable_z_min: 40
variable_unload: 100
gcode:
    {% set park_x = printer["gcode_macro M600"].park_x|float %}
    {% set park_y = printer["gcode_macro M600"].park_y|float %}
    {% set z_min = printer["gcode_macro M600"].z_min|float %}
    {% set unload = printer["gcode_macro M600"].unload|float %}

    # PAUSE_BASE captura la posicion original. No se hace RESUME automaticamente.
    PAUSE X={park_x} Y={park_y} Z=5

    {% if "xyz" in printer.toolhead.homed_axes %}
        {% if printer.toolhead.position.z|float < z_min %}
            G90
            G1 Z{z_min} F1800
        {% endif %}
        G90
        G1 X{park_x} Y{park_y} F4800
    {% endif %}

    {% if printer[printer.toolhead.extruder].can_extrude %}
        G91
        G1 E-{unload} F3600
        G90
    {% else %}
        RESPOND TYPE=error MSG="M600: extrusor demasiado frio para descargar filamento"
    {% endif %}

    M117 Cambiar filamento y pulsar RESUME

